name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token for the npm provenance attestation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # Lint and tests stay: they cost a few seconds and they are the last chance to
      # stop a broken tarball reaching npm, which cannot be unpublished after 72
      # hours. The CI workflow runs on the push to main for this same commit, but it
      # is a separate workflow triggered by the same event, so nothing orders it
      # before this job. The Creator Portal scan is deliberately not repeated here:
      # it gates portal acceptance rather than correctness, and it installs a
      # scanner whose failures are unrelated to what is being published.
      - run: npm run lint
      - run: npm run build
      - run: node --test test/*.test.mjs
      # --provenance attaches a signed build attestation, required for n8n community-node
      # verification since May 2026. Works with NPM_TOKEN below; for OIDC trusted publishing,
      # remove NPM_TOKEN and configure a Trusted Publisher on npm (no long-lived secret).
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
