name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag matching the current package version
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json

  publish-npm:
    needs: release-please
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
           (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable release tag such as v1.2.0'
            exit 1
          fi
          release_status=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')
          test "$release_status" = false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # Repeat lint and tests because publication runs independently of CI.
      # The Creator Portal scanner remains in CI.
      - run: npm run lint
      - run: npm run build
      - run: node --test test/*.test.mjs
      - name: Verify release contents
        run: |
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git diff --exit-code "refs/tags/$RELEASE_TAG" HEAD -- . ':!.github/workflows/release.yml'
          node <<'NODE'
          const assert = require('node:assert/strict');
          const version = require('./package.json').version;
          const lock = require('./package-lock.json');
          assert.equal(`v${version}`, process.env.RELEASE_TAG);
          assert.equal(lock.version, version);
          assert.equal(lock.packages[''].version, version);
          assert.equal(require('./.release-please-manifest.json')['.'], version);
          NODE
          dist_status=$(git status --porcelain -- dist)
          test -z "$dist_status"
      # npm exchanges the workflow's OIDC identity for a short-lived publish token.
      - run: npm publish --access public --provenance
